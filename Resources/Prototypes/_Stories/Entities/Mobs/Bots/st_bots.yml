    edges:
    - to: bot
      steps:
      - tag: STBoardTurret
        name: stories-construction-step-board-turret
        icon: { sprite: _Stories/Objects/Misc/STCircuitboard.rsi, state: turret }
        doAfter: 2
      - tool: Screwing
        icon: { sprite: _RMC14/Objects/Tools/screwdriver.rsi, state: screwdriver }
        doAfter: 2
      - tool: Pulsing
        icon: { sprite: _RMC14/Objects/Tools/multitool.rsi, state: multitool }
        doAfter: 2
      - tag: PowerCell
        name: stories-construction-step-power-cell
        icon: { sprite: Objects/Power/power_cells.rsi, state: high }
        doAfter: 2
      - material: CMPlasteel
        amount: 10
        doAfter: 3
      - tag: RMCMagazineM2C
        name: stories-construction-step-m2c-ammo
        icon: { sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/HMGs/m2c.rsi, state: mag-1 }
        doAfter: 2
      - tool: Welding
        icon: { sprite: _RMC14/Objects/Tools/welder.rsi, state: welder }
