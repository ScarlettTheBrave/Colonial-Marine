- type: construction
  parent: RMC
  name: stories-construction-bot-transporter-name
  id: STBotTransporterBuild
  graph: STBotTransporterGraph
  startNode: start
  targetNode: bot
  category: construction-category-st-robotics
  description: stories-construction-bot-transporter-desc
  objectType: Structure
