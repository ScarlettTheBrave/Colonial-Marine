# Stories-Robotics-Start

- type: entity
  id: STBotBase
  abstract: true
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Actions
  - type: DoAfter
  - type: Examiner
  - type: NoSlip
  - type: DeviceLinkSink
    ports:
    - SentryControl
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.4
    baseSprintSpeed: 2.4
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 2500
        restitution: 0.0
        hard: true
        mask:
        - MobMask
        layer:
        - MobLayer
        - TableLayer
        - MachineLayer
  - type: MobState
    allowedStates: [ Alive, Dead ]
  - type: MobThresholds
    thresholds:
      0: Alive
      450: Dead
  - type: HealthExaminable
    examinableTypes: []
  - type: Unrevivable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: RMCRepairable
    heal: 50
    delay: 3
    fuelUsed: 1
    skill: RMCSkillEngineer
    skillRequired: 4
    repairableDamageLimit: 450
  - type: PowerCellSlot
    cellSlotId: power_cell
  - type: PowerCellDraw
    drawRate: 3
    useRate: 0
  - type: ItemSlots
    slots:
      power_cell:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
        locked: true
        whitelist:
          tags:
          - PowerCell
  - type: ContainerContainer
    containers:
      power_cell: !type:ContainerSlot
  - type: StoriesBotBattery
    slotId: power_cell
    maxHealth: 450
    overkillDamageThreshold: 500
    destroyedBoardProto: STCircuitboardDestroyed
    scrapMaterialProto: CMSheetMetal1

- type: entity
  parent: STBotBase
  id: STBotDriller
  components:
  - type: Sprite
    sprite: _Stories/Mobs/Robots/STDrillbot.rsi
    state: idle
  - type: StoriesBotBattery
    intactBoardProto: STCircuitboardDriller
  - type: StoriesBotDriller
    duration: 5
    reinforcedDuration: 10
    blacklist:
      components:
      - Indestructible
  - type: Construction
    graph: STBotDrillerGraph
    node: bot

- type: entity
  parent: STBotBase
  id: STBotTransporter
  components:
  - type: Sprite
    sprite: _Stories/Mobs/Robots/STTransporter.rsi
    state: transporter
  - type: StoriesBotBattery
    intactBoardProto: STCircuitboardTransporter
  - type: Buckle
  - type: Strap
    position: Stand
  - type: Construction
    graph: STBotTransporterGraph
    node: bot

- type: entity
  parent: STBotBase
  id: STBotTurret
  components:
  - type: Sprite
    sprite: _Stories/Mobs/Robots/STTurret.rsi
    state: turret
  - type: StoriesBotBattery
    intactBoardProto: STCircuitboardTurret
  - type: StoriesBotTurret
    aggroRange: 7.5
    shotsPerBurst: 5
    shotInterval: 0.18
    burstCooldown: 2.2
    rotationSpeedDegrees: 180
    ammo: 75
    maxAmmo: 75
  - type: GunDamageModifier
    multiplier: 0.45
  - type: Gun
    fireRate: 6
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    minAngle: 16
    maxAngle: 42
    angleIncrease: 7
    angleDecay: 12
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_m2c2.ogg
      params:
        volume: -5
        variation: 0.05
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: Construction
    graph: STBotTurretGraph
    node: bot

- type: entity
  parent: BaseItem
  id: STCircuitboardDestroyed
  components:
  - type: Sprite
    sprite: _Stories/Objects/Misc/STCircuitboard.rsi
    state: drill
    color: "#444444"
  - type: Item
    size: Small

- type: entity
  id: STBotFrameBase
  abstract: true
  components:
  - type: Transform
    anchored: true
  - type: InteractionOutline
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 50
        mask:
        - MachineMask
        layer:
        - MachineLayer

- type: entity
  parent: STBotFrameBase
  id: STBotFrameDriller
  components:
  - type: Sprite
    sprite: _Stories/Mobs/Robots/STDrillbot.rsi
    state: idle
    color: "#555555"
  - type: Construction
    graph: STBotDrillerGraph
    node: frame
    targetNode: bot

- type: entity
  parent: STBotFrameBase
  id: STBotFrameTransporter
  components:
  - type: Sprite
    sprite: _Stories/Mobs/Robots/STTransporter.rsi
    state: transporter
    color: "#555555"
  - type: Construction
    graph: STBotTransporterGraph
    node: frame
    targetNode: bot

- type: entity
  parent: STBotFrameBase
  id: STBotFrameTurret
  components:
  - type: Sprite
    sprite: _Stories/Mobs/Robots/STTurret.rsi
    state: turret
    color: "#555555"
  - type: Construction
    graph: STBotTurretGraph
    node: frame
    targetNode: bot

# --- STBotDriller ---
- type: constructionGraph
  parent: RMC
  id: STBotDrillerGraph
  start: start
  graph:
  - node: start
    edges:
    - to: frame
      steps:
      - material: CMSteel
        amount: 20
        doAfter: 3
  - node: frame
    entity: STBotFrameDriller
    edges:
    - to: bot
      steps:
      - tag: STBoardDriller
        name: stories-construction-step-board-driller
        icon: { sprite: _Stories/Objects/Misc/STCircuitboard.rsi, state: drill }
        doAfter: 2
      - tool: Screwing
        icon: { sprite: _RMC14/Objects/Tools/screwdriver.rsi, state: screwdriver }
        doAfter: 2
      - tool: Pulsing
        icon: { sprite: _RMC14/Objects/Tools/multitool.rsi, state: multitool }
        doAfter: 2
      - tag: PowerCell
        name: stories-construction-step-power-cell
        icon: { sprite: Objects/Power/power_cells.rsi, state: high }
        doAfter: 2
      - material: CMPlasteel
        amount: 10
        doAfter: 3
      - tool: Welding
        icon: { sprite: _RMC14/Objects/Tools/welder.rsi, state: welder }
        doAfter: 3
  - node: bot
    entity: STBotDriller

- type: construction
  parent: RMC
  name: stories-construction-bot-driller-name
  id: STBotDrillerBuild
  graph: STBotDrillerGraph
  startNode: start
  targetNode: bot
  category: construction-category-st-robotics
  description: stories-construction-bot-driller-desc
  objectType: Structure
  placementMode: SnapgridCenter
  conditions:
  - !type:StoriesRequiresSkillCondition
    skill: RMCSkillEngineer
    level: 5

