# Register board tags required by TagConstructionGraphStep
- type: Tag
  id: STBoardDriller

- type: Tag
  id: STBoardTransporter

- type: Tag
  id: STBoardTurret

- type: announcementPreset
  id: STEngineeringBot
  name: stories-announcement-preset-name-engineering-bot
  description: "Telemetry alerts from marine autonomous engineering robotics"
  target: Marines
  defaultPreference: Stylized
  visibleInSettings: false
  visibleInLayoutEditor: false
  sound:
    path: "/Audio/Machines/twobeep.ogg"
  priority: 1
  canInterrupt: false
  canBeInterrupted: true
  presentations:
    stylized:
      style:
        animation:
          animation: !type:TypewriterAnimationConfig
            printSpeed: 0.025
          holdDuration: 7
          flickerChance: 0
          enableCRT: true
        layout:
          position: TopLeft
          speakerNamePosition: Below
          spritePosition: Left
          spriteSpacing: 0
          spriteDisplayMode: FullSprite
          uIScale: 3
          titlePosition: Above
        background:
          showBackground: false
          backgroundAlpha: 0.7
          backgroundColor: "#241405"
        text:
          primaryColor: "#FFD199"
          font: "Cozette"
          fontSize: 20
          lineHeight: 48
          showSpeakerName: true
          speakerNameColor: "#FFAE42"
          speakerNameFontSize: 14
        sprite:
          showSpriteBox: true
          spriteBoxColor: "#241405"
          spriteBoxBorderColor: "#FF8C1A"
          spriteBoxBorderThickness: 2
          spriteBoxPadding: 18
          spriteGlow: false
          spriteGlowColor: "#FF8C1A"
          spriteGlowIntensity: 0.6
          spriteScale: 1
        title:
          showTitle: true
          title: stories-announcement-title-engineering-bot
          titleColor: "#FF8C1A"
          titleFontSize: 15
          titleFont: "CozetteBold"
          titleUnderline: true
          titleUnderlineThickness: 2
        scaling:
          responsiveScaleFactor: 2
    default:
      style:
        animation:
          animation: !type:TypewriterAnimationConfig
            printSpeed: 0.025
          holdDuration: 7
          flickerChance: 0
        layout:
          position: TopLeft
          speakerNamePosition: Below
          spritePosition: Left
          spriteSpacing: 0
          spriteDisplayMode: FullSprite
          uIScale: 3
          titlePosition: Above
        background:
          showBackground: false
          backgroundAlpha: 0.7
          backgroundColor: "#241405"
        text:
          primaryColor: "#FFD199"
          font: "Cozette"
          fontSize: 20
          lineHeight: 48
          showSpeakerName: true
          speakerNameColor: "#FFAE42"
          speakerNameFontSize: 14
        sprite:
          showSpriteBox: true
          spriteBoxColor: "#241405"
          spriteBoxBorderColor: "#FF8C1A"
          spriteBoxBorderThickness: 2
          spriteBoxPadding: 18
          spriteBoxShader: RMCMarineAnnouncementGrid
          spriteGlow: false
          spriteGlowColor: "#FF8C1A"
          spriteGlowIntensity: 0.6
          spriteScale: 1
        title:
          showTitle: true
          title: stories-announcement-title-engineering-bot
          titleColor: "#FF8C1A"
