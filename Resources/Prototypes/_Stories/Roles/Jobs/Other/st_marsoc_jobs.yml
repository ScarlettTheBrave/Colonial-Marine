# MARSOC OFFICER (Capt / Maj)
- type: job
  parent: CMJobBase
  id: STMarsocOfficer
  name: st-job-name-marsoc-officer
  description: st-ghost-role-marsoc-officer-desc
  playTimeTracker: STJobMarsocOfficer
  whitelisted: true
  requirements:
  - !type:RoleTimeRequirement
    role: CMJobSquadLeader
    time: 0 #180000 # 50 часов на КО/КС (можешь поставить 0 для локального теста)
  - !type:DepartmentTimeRequirement
    department: CMDepartmentCommand
    time: 0 #360000 # 100 часов КОМа
  ranks:
    RMCRankCaptain: [ ]
    RMCRankMajor: [ ]
  startingGear: STGearMarsocOfficer
  icon: STJobIconMarsocOfficer
  joinNotifyCrew: false
  access:
  - CMAccessERT
  accessGroups:
  - ShipMasterAccess
  spawnMenuRoleName: ST MARSOC Officer (Capt/Maj)
  special:
  - !type:AddComponentSpecial
    components:
    - type: Language
      spokenLanguages:
      - English
      - SignLanguage
      - Russian
      - Japanese
      understoodLanguages:
      - English
      - SignLanguage
      - Russian
      - Japanese
      currentLanguage: English
      defaultLanguage: English
    - type: Skills
      skills:
        RMCSkillCqc: 4
        RMCSkillFireman: 4
        RMCSkillEngineer: 2
        RMCSkillConstruction: 2
        RMCSkillFirearms: 2
        RMCSkillLeadership: 3
        RMCSkillOverwatch: 1
        RMCSkillMedical: 2
        RMCSkillMeleeWeapons: 1
        RMCSkillEndurance: 4
        RMCSkillJtac: 3
    - type: JobPrefix
      prefix: st-job-prefix-marsoc-officer
    - type: MarineOrders
    - type: RMCPointing
    - type: SquadLeader
      icon:
        sprite: _RMC14/Interface/job_icons/UNMC/marsoc.rsi
        state: hudsquad_soccmd
    - type: STMarsocOfficer
    - type: STMarsocOperative
      rankPrefix: st-marsoc-rank-officer
      callsignDataset: STMarsocCallsignsOfficer
      roleDutiesLoc: st-ghost-role-marsoc-officer-desc
      canBeSynth: false
      canDeployBeacon: true
      canConfirmExtraction: true
  hidden: false

- type: startingGear
  id: STGearMarsocOfficer
  equipment:
    head: STArmorHelmetMARSOC
    eyes: RMCGlassesSPPCommandoNightVision
    mask: RMCMaskBalaclavaMARSOC
    ears: RMCHeadsetMARSOC
    jumpsuit: RMCJumpsuitMarsocWebbingBuckshot
    outerClothing: STArmorMARSOCXM40
    gloves: RMCHandsVeteran
    shoes: CMBootsBlackFilled
    suitstorage: STWeaponRifleXM40Marsoc
    id: STDogtagMarsocOfficer
    belt: RMCWeaponShotgunXM38Filled
    back: RMCSatchelMARSOC
    pocket1: RMCPouchMedicalSocMarineRaiderFill
    pocket2: RMCPouchToolsSocMarineRaiderFill
  storage:
    back:
    - STMarsocExtractionBeacon

