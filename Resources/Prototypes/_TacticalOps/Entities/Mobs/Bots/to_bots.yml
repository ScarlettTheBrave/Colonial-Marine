# Stories-Robotics-Start

- type: entity
  id: TOBotBase
  abstract: true
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Actions
  - type: DoAfter
  - type: Examiner
  - type: NoSlip
  - type: DeviceLinkSink
    ports:
    - SentryControl
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.4
    baseSprintSpeed: 2.4
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 2500
        restitution: 0.0
        hard: true
        mask:
        - MobMask
        layer:
        - MobLayer
        - TableLayer
        - MachineLayer
  - type: MobState
    allowedStates: [ Alive, Dead ]
  - type: MobThresholds
    thresholds:
      0: Alive
      450: Dead
  - type: HealthExaminable
    examinableTypes: []
  - type: Unrevivable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: CMRepairable
    heal: 50
    delay: 3
    fuelUsed: 1
    skill: CMSkillEngineer
    skillRequired: 4
    repairableDamageLimit: 450
  - type: PowerCellSlot
    cellSlotId: power_cell
  - type: PowerCellDraw
    drawRate: 3
    useRate: 0
  - type: ItemSlots
    slots:
      power_cell:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
        locked: true
        whitelist:
          tags:
          - PowerCell
  - type: ContainerContainer
    containers:
      power_cell: !type:ContainerSlot
  - type: TacticalBotBattery
    slotId: power_cell
    maxHealth: 450
    overkillDamageThreshold: 500
    destroyedBoardProto: TOCircuitboardDestroyed
    scrapMaterialProto: CMSheetMetal1

- type: entity
  parent: TOBotBase
  id: TOBotDriller
  components:
  - type: Sprite
    sprite: _TacticalOps/Mobs/Robots/TODrillbot.rsi
    state: idle
  - type: TacticalBotBattery
    intactBoardProto: TOCircuitboardDriller
  - type: TacticalBotDriller
    duration: 5
    reinforcedDuration: 10
    blacklist:
      components:
      - Indestructible
  - type: Construction
    graph: TOBotDrillerGraph
    node: bot

- type: entity
  parent: TOBotBase
  id: TOBotTransporter
  components:
  - type: Sprite
    sprite: _TacticalOps/Mobs/Robots/TOTransporter.rsi
    state: transporter
  - type: TacticalBotBattery
    intactBoardProto: TOCircuitboardTransporter
  - type: Buckle
  - type: Strap
    position: Stand
  - type: Construction
    graph: TOBotTransporterGraph
    node: bot

- type: entity
  parent: TOBotBase
  id: TOBotTurret
  components:
  - type: Sprite
    sprite: _TacticalOps/Mobs/Robots/TOTurret.rsi
    state: turret
  - type: TacticalBotBattery
    intactBoardProto: TOCircuitboardTurret
  - type: TacticalBotTurret
    aggroRange: 7.5
    shotsPerBurst: 5
    shotInterval: 0.18
    burstCooldown: 2.2
    rotationSpeedDegrees: 180
    ammo: 75
    maxAmmo: 75
  - type: GunDamageModifier
    multiplier: 0.45
  - type: Gun
    fireRate: 6
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    minAngle: 16
    maxAngle: 42
    angleIncrease: 7
    angleDecay: 12
    soundGunshot:
      path: /Audio/_ColonialMarine/Weapons/Guns/Gunshots/gun_m2c2.ogg
      params:
        volume: -5
        variation: 0.05
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: Construction
    graph: TOBotTurretGraph
    node: bot

- type: entity
  parent: BaseItem
  id: TOCircuitboardDestroyed
  components:
  - type: Sprite
    sprite: _TacticalOps/Objects/Misc/TOCircuitboard.rsi
    state: drill
    color: "#444444"
  - type: Item
    size: Small

- type: entity
  id: TOBotFrameBase
  abstract: true
  components:
  - type: Transform
    anchored: true
  - type: InteractionOutline
  - type: Clickable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 50
        mask:
        - MachineMask
        layer:
        - MachineLayer

- type: entity
  parent: TOBotFrameBase
  id: TOBotFrameDriller
  components:
  - type: Sprite
    sprite: _TacticalOps/Mobs/Robots/TODrillbot.rsi
    state: idle
    color: "#555555"
  - type: Construction
    graph: TOBotDrillerGraph
    node: frame
    targetNode: bot

- type: entity
  parent: TOBotFrameBase
  id: TOBotFrameTransporter
  components:
  - type: Sprite
    sprite: _TacticalOps/Mobs/Robots/TOTransporter.rsi
    state: transporter
    color: "#555555"
  - type: Construction
    graph: TOBotTransporterGraph
    node: frame
    targetNode: bot

- type: entity
  parent: TOBotFrameBase
  id: TOBotFrameTurret
  components:
  - type: Sprite
    sprite: _TacticalOps/Mobs/Robots/TOTurret.rsi
    state: turret
    color: "#555555"
  - type: Construction
    graph: TOBotTurretGraph
    node: frame
    targetNode: bot

# --- TOBotDriller ---
- type: constructionGraph
  parent: RMC
  id: TOBotDrillerGraph
  start: start
  graph:
  - node: start
    edges:
    - to: frame
      steps:
      - material: CMSteel
        amount: 20
        doAfter: 3
  - node: frame
    entity: TOBotFrameDriller
    edges:
    - to: bot
      steps:
      - tag: TOBoardDriller
        name: tactical-construction-step-board-driller
        icon: { sprite: _TacticalOps/Objects/Misc/TOCircuitboard.rsi, state: drill }
        doAfter: 2
      - tool: Screwing
        icon: { sprite: _ColonialMarine/Objects/Tools/screwdriver.rsi, state: screwdriver }
        doAfter: 2
      - tool: Pulsing
        icon: { sprite: _ColonialMarine/Objects/Tools/multitool.rsi, state: multitool }
        doAfter: 2
      - tag: PowerCell
        name: tactical-construction-step-power-cell
        icon: { sprite: Objects/Power/power_cells.rsi, state: high }
        doAfter: 2
      - material: CMPlasteel
        amount: 10
        doAfter: 3
      - tool: Welding
        icon: { sprite: _ColonialMarine/Objects/Tools/welder.rsi, state: welder }
        doAfter: 3
  - node: bot
    entity: TOBotDriller

- type: construction
  parent: RMC
  name: tactical-construction-bot-driller-name
  id: TOBotDrillerBuild
  graph: TOBotDrillerGraph
  startNode: start
  targetNode: bot
  category: construction-category-to-robotics
  description: tactical-construction-bot-driller-desc
  objectType: Structure
  placementMode: SnapgridCenter
  conditions:
  - !type:TacticalRequiresSkillCondition
    skill: CMSkillEngineer
    level: 5

# --- TOBotTransporter ---
- type: constructionGraph
  parent: RMC
  id: TOBotTransporterGraph
  start: start
  graph:
  - node: start
    edges:
    - to: frame
      steps:
      - material: CMSteel
        amount: 20
        doAfter: 3
  - node: frame
    entity: TOBotFrameTransporter
    edges:
    - to: bot
      steps:
      - tag: TOBoardTransporter
        name: tactical-construction-step-board-transporter
        icon: { sprite: _TacticalOps/Objects/Misc/TOCircuitboard.rsi, state: transporter }
        doAfter: 2
      - tool: Screwing
        icon: { sprite: _ColonialMarine/Objects/Tools/screwdriver.rsi, state: screwdriver }
        doAfter: 2
      - tool: Pulsing
        icon: { sprite: _ColonialMarine/Objects/Tools/multitool.rsi, state: multitool }
        doAfter: 2
      - tag: PowerCell
        name: tactical-construction-step-power-cell
        icon: { sprite: Objects/Power/power_cells.rsi, state: high }
        doAfter: 2
      - material: CMPlasteel
        amount: 10
        doAfter: 3
      - tool: Welding
        icon: { sprite: _ColonialMarine/Objects/Tools/welder.rsi, state: welder }
        doAfter: 3
  - node: bot
    entity: TOBotTransporter

- type: construction
  parent: RMC
  name: tactical-construction-bot-transporter-name
  id: TOBotTransporterBuild
  graph: TOBotTransporterGraph
  startNode: start
  targetNode: bot
  category: construction-category-to-robotics
  description: tactical-construction-bot-transporter-desc
  objectType: Structure
  placementMode: SnapgridCenter
  conditions:
  - !type:TacticalRequiresSkillCondition
    skill: CMSkillEngineer
    level: 5

# --- TOBotTurret ---
- type: constructionGraph
  parent: RMC
  id: TOBotTurretGraph
  start: start
  graph:
  - node: start
    edges:
    - to: frame
      steps:
      - material: CMSteel
        amount: 20
        doAfter: 3
  - node: frame
    entity: TOBotFrameTurret
    edges:
    - to: bot
      steps:
      - tag: TOBoardTurret
        name: tactical-construction-step-board-turret
        icon: { sprite: _TacticalOps/Objects/Misc/TOCircuitboard.rsi, state: turret }
        doAfter: 2
      - tool: Screwing
        icon: { sprite: _ColonialMarine/Objects/Tools/screwdriver.rsi, state: screwdriver }
        doAfter: 2
      - tool: Pulsing
        icon: { sprite: _ColonialMarine/Objects/Tools/multitool.rsi, state: multitool }
        doAfter: 2
      - tag: PowerCell
        name: tactical-construction-step-power-cell
        icon: { sprite: Objects/Power/power_cells.rsi, state: high }
        doAfter: 2
      - material: CMPlasteel
        amount: 10
        doAfter: 3
      - tag: CMMagazineM2C
        name: tactical-construction-step-m2c-ammo
        icon: { sprite: _ColonialMarine/Objects/Weapons/Guns/Ammunition/Magazines/HMGs/m2c.rsi, state: mag-1 }
        doAfter: 2
      - tool: Welding
        icon: { sprite: _ColonialMarine/Objects/Tools/welder.rsi, state: welder }
        doAfter: 3
  - node: bot
