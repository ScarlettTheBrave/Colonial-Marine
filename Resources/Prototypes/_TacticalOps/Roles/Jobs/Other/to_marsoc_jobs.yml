# MARSOC OFFICER (Capt / Maj)
- type: job
  parent: CMJobBase
  id: TOMarsocOfficer
  name: to-job-name-marsoc-officer
  description: to-ghost-role-marsoc-officer-desc
  playTimeTracker: TOJobMarsocOfficer
  whitelisted: true
  requirements:
  - !type:RoleTimeRequirement
    role: CMJobSquadLeader
    time: 0 #180000 # 50 часов на КО/КС (можешь поставить 0 для локального теста)
  - !type:DepartmentTimeRequirement
    department: CMDepartmentCommand
    time: 0 #360000 # 100 часов КОМа
  ranks:
    CMRankCaptain: [ ]
    CMRankMajor: [ ]
  startingGear: TOGearMarsocOfficer
  icon: TOJobIconMarsocOfficer
  joinNotifyCrew: false
  access:
  - CMAccessERT
  accessGroups:
  - ShipMasterAccess
  spawnMenuRoleName: ST MARSOC Officer (Capt/Maj)
  special:
  - !type:AddComponentSpecial
    components:
    - type: Language
      spokenLanguages:
      - English
      - SignLanguage
      - Russian
      - Japanese
      understoodLanguages:
      - English
      - SignLanguage
      - Russian
      - Japanese
      currentLanguage: English
      defaultLanguage: English
    - type: Skills
      skills:
        CMSkillCqc: 4
        CMSkillFireman: 4
        CMSkillEngineer: 2
        CMSkillConstruction: 2
        CMSkillFirearms: 2
        CMSkillLeadership: 3
        CMSkillOverwatch: 1
        CMSkillMedical: 2
        CMSkillMeleeWeapons: 1
        CMSkillEndurance: 4
        CMSkillJtac: 3
    - type: JobPrefix
      prefix: to-job-prefix-marsoc-officer
    - type: MarineOrders
    - type: CMPointing
    - type: SquadLeader
      icon:
        sprite: _ColonialMarine/Interface/job_icons/UNMC/marsoc.rsi
        state: hudsquad_soccmd
    - type: TOMarsocOfficer
    - type: TOMarsocOperative
      rankPrefix: to-marsoc-rank-officer
      callsignDataset: TOMarsocCallsignsOfficer
      roleDutiesLoc: to-ghost-role-marsoc-officer-desc
      canBeSynth: false
      canDeployBeacon: true
      canConfirmExtraction: true
  hidden: false

- type: startingGear
  id: TOGearMarsocOfficer
  equipment:
    head: TOArmorHelmetMARSOC
    eyes: CMGlassesSPPCommandoNightVision
    mask: CMMaskBalaclavaMARSOC
    ears: CMHeadsetMARSOC
    jumpsuit: CMJumpsuitMarsocWebbingBuckshot
    outerClothing: TOArmorMARSOCXM40
    gloves: CMHandsVeteran
    shoes: CMBootsBlackFilled
    suitstorage: TOWeaponRifleXM40Marsoc
    id: TODogtagMarsocOfficer
    belt: CMWeaponShotgunXM38Filled
    back: CMSatchelMARSOC
    pocket1: CMPouchMedicalSocMarineRaiderFill
    pocket2: CMPouchToolsSocMarineRaiderFill
  storage:
    back:
    - TOMarsocExtractionBeacon

